# Mimics a typical cPanel shared host: CGI allowed, .htaccess overrides restricted like cPanel's default.
Listen 8085
Listen 8086
<VirtualHost *:8085>
  ServerName sub.test
  DocumentRoot /srv/wc/sub_root
  <Directory /srv/wc/sub_root>
    Options ExecCGI SymLinksIfOwnerMatch IncludesNOEXEC
    AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
    Require all granted
  </Directory>
  AddHandler cgi-script .cgi
  ErrorLog /srv/wc/logs/sub_error.log
</VirtualHost>
<VirtualHost *:8086>
  ServerName root.test
  DocumentRoot /srv/wc/root_root
  <Directory /srv/wc/root_root>
    Options ExecCGI SymLinksIfOwnerMatch IncludesNOEXEC
    AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
    Require all granted
  </Directory>
  AddHandler cgi-script .cgi
  ErrorLog /srv/wc/logs/root_error.log
</VirtualHost>
